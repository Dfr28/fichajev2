version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fichaje_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: fichaje_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fichaje
      POSTGRES_USER: fichaje
      POSTGRES_PASSWORD: fichaje
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  apache_php:
    image: php:8.3-apache
    container_name: fichaje_apache_php
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/apache/default.conf:/etc/apache2/sites-available/000-default.conf

volumes:
  postgres_data:
